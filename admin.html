<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — JasLearn</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#f5f5f0;color:#333;padding:2rem}
h1{margin-bottom:1.5rem;color:#7F755E}
.tabs{display:flex;gap:0.5rem;margin-bottom:1.5rem}
.tab{padding:0.6rem 1.2rem;border:none;background:#ddd;cursor:pointer;border-radius:6px;font-weight:500}
.tab.active{background:#7F755E;color:#fff}
.table-wrap{overflow-x:auto;background:#fff;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
table{width:100%;border-collapse:collapse;font-size:0.9rem}
th,td{padding:0.75rem 1rem;text-align:left;border-bottom:1px solid #eee}
th{background:#7F755E;color:#fff;font-weight:600}
tr:hover{background:#fafaf5}
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-bottom:1.5rem}
.stat-card{background:#fff;padding:1.2rem;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.stat-card h3{font-size:0.85rem;color:#888;text-transform:uppercase;margin-bottom:0.3rem}
.stat-card .num{font-size:1.8rem;font-weight:700;color:#7F755E}
#loginScreen{position:fixed;inset:0;background:#7F755E;display:flex;align-items:center;justify-content:center;z-index:9999}
#loginScreen input{padding:0.8rem 1rem;border-radius:6px;border:none;font-size:1rem;width:260px}
#loginScreen button{padding:0.8rem 1.5rem;border-radius:6px;border:none;background:#333;color:#fff;margin-left:0.5rem;cursor:pointer}
.hidden{display:none}
</style>
</head>
<body>
<div id="loginScreen">
  <div>
    <input type="password" id="adminPass" placeholder="Admin password">
    <button onclick="checkAdmin()">Enter</button>
  </div>
</div>

<div id="adminPanel" class="hidden">
<h1>📊 JasLearn Admin</h1>
<div class="stat-cards">
  <div class="stat-card"><h3>Total Users</h3><div class="num" id="statUsers">-</div></div>
  <div class="stat-card"><h3>Total Orders</h3><div class="num" id="statOrders">-</div></div>
  <div class="stat-card"><h3>Revenue</h3><div class="num" id="statRevenue">-</div></div>
  <div class="stat-card"><h3>Pending</h3><div class="num" id="statPending">-</div></div>
</div>

<div class="tabs">
  <button class="tab active" onclick="showTab('users')">Users</button>
  <button class="tab" onclick="showTab('orders')">Orders</button>
  <button class="tab" onclick="showTab('payments')">Payments</button>
  <button class="tab" onclick="showTab('logs')">Activity Logs</button>
</div>

<div class="table-wrap" id="usersTab">
<table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Company</th><th>Role</th><th>Joined</th></tr></thead><tbody id="usersBody"></tbody></table>
</div>
<div class="table-wrap hidden" id="ordersTab">
<table><thead><tr><th>ID</th><th>User</th><th>Plan</th><th>Amount</th><th>Status</th><th>Period</th><th>Date</th></tr></thead><tbody id="ordersBody"></tbody></table>
</div>
<div class="table-wrap hidden" id="paymentsTab">
<table><thead><tr><th>ID</th><th>User</th><th>Amount</th><th>Currency</th><th>Status</th><th>Method</th><th>Date</th></tr></thead><tbody id="paymentsBody"></tbody></table>
</div>
<div class="table-wrap hidden" id="logsTab">
<table><thead><tr><th>ID</th><th>User</th><th>Action</th><th>Details</th><th>Date</th></tr></thead><tbody id="logsBody"></tbody></table>
</div>
</div>

<script>
const API_BASE = window.location.origin + '/api';
let adminToken = '';

function checkAdmin() {
  adminToken = document.getElementById('adminPass').value;
  fetch(API_BASE + '/admin/stats', {headers:{'x-admin-key':adminToken}})
    .then(r => {if(!r.ok)throw new Error(); return r.json()})
    .then(d => {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('adminPanel').classList.remove('hidden');
      document.getElementById('statUsers').textContent = d.users || 0;
      document.getElementById('statOrders').textContent = d.orders || 0;
      document.getElementById('statRevenue').textContent = '$' + ((d.revenue||0)/100).toFixed(2);
      document.getElementById('statPending').textContent = d.pending || 0;
      loadAll();
    })
    .catch(() => alert('Wrong password'));
}

function showTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  ['users','orders','payments','logs'].forEach(t => {
    document.getElementById(t+'Tab').classList.toggle('hidden', t!==name);
  });
}

async function loadAll() {
  const h = {'x-admin-key': adminToken};
  
  const users = await fetch(API_BASE + '/admin/users', {headers:h}).then(r=>r.json()).catch(()=>({users:[]}));
  document.getElementById('usersBody').innerHTML = users.users.map(u=>`<tr><td>${u.id}</td><td>${u.first_name||''} ${u.last_name||''}</td><td>${u.email}</td><td>${u.company||'-'}</td><td>${u.role}</td><td>${u.created_at?.slice(0,10)||'-'}</td></tr>`).join('') || '<tr><td colspan="6">No users</td></tr>';

  const orders = await fetch(API_BASE + '/admin/orders', {headers:h}).then(r=>r.json()).catch(()=>({orders:[]}));
  document.getElementById('ordersBody').innerHTML = orders.orders.map(o=>`<tr><td>${o.id}</td><td>${o.user_id}</td><td>${o.plan}</td><td>$${(o.amount/100).toFixed(2)}</td><td>${o.status}</td><td>${o.billing_period||'-'}</td><td>${o.created_at?.slice(0,10)||'-'}</td></tr>`).join('') || '<tr><td colspan="7">No orders</td></tr>';

  const payments = await fetch(API_BASE + '/admin/payments', {headers:h}).then(r=>r.json()).catch(()=>({payments:[]}));
  document.getElementById('paymentsBody').innerHTML = payments.payments.map(p=>`<tr><td>${p.id}</td><td>${p.user_id}</td><td>$${(p.amount/100).toFixed(2)}</td><td>${p.currency}</td><td>${p.status}</td><td>${p.payment_method||'-'}</td><td>${p.created_at?.slice(0,10)||'-'}</td></tr>`).join('') || '<tr><td colspan="7">No payments</td></tr>';

  const logs = await fetch(API_BASE + '/admin/logs', {headers:h}).then(r=>r.json()).catch(()=>({logs:[]}));
  document.getElementById('logsBody').innerHTML = logs.logs.map(l=>`<tr><td>${l.id}</td><td>${l.user_id||'-'}</td><td>${l.action}</td><td>${l.details||'-'}</td><td>${l.created_at?.slice(0,10)||'-'}</td></tr>`).join('') || '<tr><td colspan="5">No logs</td></tr>';
}
</script>
</body>
</html>
